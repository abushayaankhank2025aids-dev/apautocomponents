name: Deploy static website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ap-auto/package-lock.json
      - name: Configure GitHub Pages URLs
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == "$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            base_path=""
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base_path="/${repo_name}"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: ap-auto
        run: npm ci
      - name: Build static website
        working-directory: ap-auto
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ap-auto/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
